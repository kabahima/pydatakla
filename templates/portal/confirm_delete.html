{% extends 'portal/base.html' %}
{% block title %}Delete{% endblock %}
{% block heading %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-md bg-white rounded-xl shadow-sm border border-red-100 p-6">
  <p class="text-slate-700 mb-6">Are you sure you want to delete <strong class="text-slate-900">{{ object }}</strong>? This cannot be undone.</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition">
      Yes, delete
    </button>
    <a href="javascript:history.back()" class="text-sm text-slate-500 hover:text-slate-700 px-4 py-2 rounded-lg border border-slate-200 hover:border-slate-300 transition">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
