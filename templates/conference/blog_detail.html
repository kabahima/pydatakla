{% extends "base.html" %}

{% block title %}{{ post.title }} - PyData Kampala{% endblock %}

{% block content %}
<article class="px-6 md:px-10 py-16 max-w-3xl mx-auto">
  <a href="{% url 'conference:blog' %}" class="text-blue-400 hover:text-blue-300 text-sm inline-flex items-center mb-6">
    <- Back to blog
  </a>

  <h1 class="text-4xl font-serif mb-4">{{ post.title }}</h1>
  <p class="text-blue-400 text-sm mb-8">{{ post.published_at|date:"F j, Y" }}</p>

  {% if post.cover_image %}
  <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full h-72 object-cover rounded-xl border border-blue-800 mb-8">
  {% endif %}

  <p class="text-blue-200 leading-relaxed whitespace-pre-line">{{ post.content }}</p>
</article>
{% endblock %}
